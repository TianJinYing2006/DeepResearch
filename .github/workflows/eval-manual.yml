name: eval-manual

# W6 TBD-4 定案：eval 真实 API 轨——不进自动 CI（成本 ~¥0.5/轮 + 40~60min + Qdrant 容器）
# 手动触发：GitHub Actions 页面 → Run workflow
# 需在仓库 Settings → Secrets 配置：DASHSCOPE_API_KEY, BOCHA_API_KEY
# fork 拿不到 secrets（GitHub 安全机制）→ 天然防滥用

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "触发原因（如：里程碑复现 / 回归验证）"
        required: false
        default: "milestone-repro"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/healthz || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
      QDRANT_URL: http://127.0.0.1:6333
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval (20 条，~¥0.5/轮，~40-60min)
        run: python -m research_engine.eval.run --dataset research_engine/eval/dataset.jsonl

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: research_engine/eval/results/run_*/
          if-no-files-found: warn
