name: CI

# W6 TBD-4 定案：自动轨仅 ruff + pytest 离线单测（零 LLM 调用、零 API key、零外部服务）
# eval 真实 API 轨见 eval-manual.yml（workflow_dispatch 手动触发，成本敏感）
#
# W8 Arm 3 第三刀（§5.3.3）：Python 版本扩为 matrix 3.11/3.12/3.13。
# 目的：① 让「声明支持三档」被真实验证（3.12/3.13 此前从未跑过）；
#       ② 把「四处版本口径」收敛为两处真强制 —— CI matrix + 运行时版本闸
#          （`research_engine/__init__.py`），其余（pyproject requires-python、README）只是声明。
# 成本账：正常单档约 2~3 分钟；apt 依赖安装曾出现单次 545s（见「Install PDF render system deps」注释）。
# 2026-10-26：PR 校验覆盖所有 base（堆叠 PR 也需要 checks）；push 仍只监听 master/dev。

on:
  push:
    branches: [master, dev]
  # 不限制 base 分支：堆叠 PR 的 base 可能是 feature 分支，旧配置会导致完全无 checks。
  pull_request:

permissions:
  contents: read

concurrency:
  # PR 有新提交时取消旧 run；dev/master push 不取消（workflow_run 部署依赖 CI 完成）。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # fail-fast=false：任一档失败也要看全三档 —— 否则只看到第一个红的，会误判影响面
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # v7: Node 24 + ESM（v5 起要求 runner >= v2.327.1，GitHub-hosted 已满足）
      # 升级目的：消除 "Node.js 20 is deprecated" 告警
      - uses: actions/checkout@v7
        with:
          # 2026-10-27：文档漂移守卫要校验 figures 的 tag 集合 ≡ git tag；
          # 默认 shallow 克隆会让该校验空转（shallow 时守卫显式失败，不静默降级）
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev-lock.txt

      # W8 Arm 3 第一刀（§5.3.1）：按 lock 安装 ⇒ 同一 commit 在不同机器/时间装出同一套版本。
      # lock 生成命令见两份 lock 的文件头（`uv pip compile --universal`；早期曾用 pip-compile，
      # 因其丢弃环境标记已被实测否决，详见 §5.3.1 实测修正）。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev-lock.txt

      - name: Lint (ruff)
        run: ruff check .

      # W8 Arm 7 轨道 1：白名单集合 ≡ git 跟踪集合。
      # 为什么必须在 CI 里跑：.gitignore 对【已跟踪】文件无效，白名单与跟踪状态的偏离会静默积累
      # （2026-09-14 实测偏了 94 项），只能靠机器持续比对。零 LLM、零网络。
      - name: Eval 产物白名单纪律（Arm 7）
        run: python tools/check_results_whitelist.py

      # W9（D-20 硬边界 ①）：前端只做呈现，不得把研究判定逻辑搬进呈现层。
      # 一旦 web/frontend 出现 `research_engine` 字面量即判违规。零 LLM、零网络。
      - name: 前端边界守卫（不得 import research_engine）
        run: python tools/check_frontend_boundary.py

      # 2026-10-26 C0-2：公开仓不得出现真实主机 IP。部署链路已迁 GitHub Secrets，
      # 基线已清空 ⇒ 使用 --strict（零 LLM、零网络）。
      - name: 公开仓脱敏守卫（真实 IP）
        run: python tools/check_public_ip.py --strict

      # 2026-10-27：文档漂移守卫（figures tag / ICP 号 / ADR 索引 / CI 守卫清单 / 开放注册口径 / README 数字）。
      # 依赖完整 tag 历史 ⇒ 本 job 的 checkout 已设 fetch-depth: 0；零 LLM、零网络。
      - name: 文档漂移守卫（figures/ADR/注册口径）
        run: python tools/check_doc_consistency.py

      # 需求 38 F2：weasyprint 运行依赖（PDF 渲染测试真跑；字体含 CJK，保证中文可提取）
      # 2026-10-26：apt 慢源主要是 fonts-noto-cjk（61MB）。字体复用 e2e 的 deb 缓存；
      # pango 两库很小，保留 apt（先直装，失败再 update+重试）。step 超时 12 分钟兜底。
      - name: Cache CJK font package (lint)
        uses: actions/cache@v4
        with:
          path: ~/.cache/dr-fonts
          key: fonts-noto-cjk-20230817-${{ runner.os }}

      - name: Install PDF render system deps (weasyprint)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          apt_get() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 "$@"
          }
          pango=(libpango-1.0-0 libpangoft2-1.0-0)
          if ! apt_get install -y --no-install-recommends "${pango[@]}"; then
            for attempt in 1 2 3; do
              if apt_get update && apt_get install -y --no-install-recommends "${pango[@]}"; then
                break
              fi
              echo "pango apt 第 ${attempt} 次失败，10s 后重试"
              sleep 10
            done
          fi
          if ! dpkg -s libpango-1.0-0 >/dev/null 2>&1; then
            echo "pango 依赖安装失败"; exit 1
          fi
          # CJK 字体：复用 e2e 的 deb 缓存（命中后无需下载 61MB）
          pkg_dir="$HOME/.cache/dr-fonts"
          mkdir -p "$pkg_dir"
          if ! ls "$pkg_dir"/*.deb >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if (cd "$pkg_dir" && apt-get download fonts-noto-cjk); then
                break
              fi
              apt_get update || true
              echo "字体包下载第 ${attempt} 次失败，10s 后重试"
              sleep 10
            done
          fi
          sudo dpkg -i "$pkg_dir"/*.deb

      - name: Test (pytest)
        run: pytest tests/ -q --durations=10

  # P1/P2（L3-A 部署底座与持久化）：
  # - compose 校验 / 迁移幂等 / 迁移结构断言 / API 镜像构建（P1 + P2-A）
  # - RunStore 在真实 PostgreSQL 上的持久化契约测试（P2-B）
  # 全程零外部账号：PostgreSQL / Redis 由 compose 在 runner 上启动，不调用 LLM / 不读 .env。
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compose 配置校验
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: 启动 PostgreSQL / Redis（等待健康检查）
        run: docker compose -f docker-compose.staging.yml up -d --wait --wait-timeout 120 postgres redis

      - name: 执行迁移（首次）
        run: docker compose -f docker-compose.staging.yml run --rm migrate

      # 幂等门禁：第二次执行必须全部 skip（applied=0），否则说明迁移记录机制失效
      - name: 迁移幂等（第二次应 applied=0）
        run: |
          docker compose -f docker-compose.staging.yml run --rm migrate | tee /tmp/migrate_2nd.log
          grep -q "applied=0" /tmp/migrate_2nd.log

      # P2 结构门禁：迁移后的表 / 约束 / 级联行为必须与 DDL 一致（断言失败即 job 红）
      - name: 迁移结构断言（checks/）
        run: |
          for f in migrations/checks/*.sql; do
            echo "== 断言：$f =="
            docker compose -f docker-compose.staging.yml exec -T postgres \
              psql -U deepresearch -d deepresearch -v ON_ERROR_STOP=1 -f - < "$f"
          done

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev-lock.txt

      # P2-B / P3-A 持久化与队列：真实 PostgreSQL + Redis 上跑契约与端到端测试
      # P2-2 保留期清理：purge_before 批量子句 / 级联语义在真实 PG 上验证
      # P2-3 连接池：statement_timeout 生效 / 连接复用 / 慢查询告警在真实 PG 上验证
      # P2-4 事件唤醒：append_event / finalize_run 的 LISTEN/NOTIFY 语义在真实 PG 上验证
      # P2-6 告警外送：alert_states / alert_deliveries 的领取、放弃、重试在真实 PG 上验证
      # P2-5b 申诉状态机：唯一约束 / 领取竞争 / 决策终态在真实 PG 上验证
      - name: RunStore / Worker 集成测试（真实 PostgreSQL + Redis）
        env:
          DR_TEST_DATABASE_URL: postgresql://deepresearch:deepresearch-local@127.0.0.1:5432/deepresearch
          DR_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          OTEL_SDK_DISABLED: "true"
        run: pytest tests/test_run_store.py tests/test_worker_integration.py tests/test_retention.py tests/test_pg_pool.py tests/test_notify.py tests/test_alert_delivery.py tests/test_appeals.py tests/test_snapshot_store_pg.py tests/test_checkpoint_pg.py tests/test_resume_drill_pg.py tests/test_hitl_interaction_pg.py tests/test_hitl_resume_drill_pg.py tests/test_export_jobs_pg.py -q

      # P8-A 恢复演练：真实脚本「备份（校验可读）→ 清库 → 恢复」；用种子数据与结构断言双向验证。
      # 没有恢复演练就不算有备份（上线清单 §3.8）。
      - name: 备份与恢复演练（P8-A，真实脚本）
        run: |
          set -e
          DC="docker compose -f docker-compose.staging.yml"
          PG_ENV="-e PGHOST=postgres -e PGPORT=5432 -e PGUSER=deepresearch -e PGDATABASE=deepresearch -e PGPASSWORD=deepresearch-local"
          $DC exec -T postgres psql -U deepresearch -d deepresearch -v ON_ERROR_STOP=1 \
            -c "INSERT INTO users (user_id, email, password_hash) VALUES ('drill-user', 'drill@example.com', 'x') ON CONFLICT DO NOTHING" > /dev/null
          before=$($DC exec -T postgres psql -U deepresearch -d deepresearch -tAc "SELECT count(*) FROM users WHERE user_id = 'drill-user'")
          $DC exec -T $PG_ENV -e BACKUP_DIR=/tmp/dr-backups postgres sh -s < tools/backup.sh
          $DC exec -T $PG_ENV -e BACKUP_DIR=/tmp/dr-backups postgres sh -s < tools/restore.sh
          after=$($DC exec -T postgres psql -U deepresearch -d deepresearch -tAc "SELECT count(*) FROM users WHERE user_id = 'drill-user'")
          test "$before" = "1"
          test "$after" = "1"
          for f in migrations/checks/*.sql; do
            $DC exec -T postgres psql -U deepresearch -d deepresearch -v ON_ERROR_STOP=1 -f - < "$f" > /dev/null
          done
          echo "restore drill ok"

      # 需求 1（#145）：backup-verify 双路径自检 —— 「最新 dump 的新鲜度 + 可读性」独立可复核。
      # 过期路径断言退出码 = 4（副本 mtime 拨回 3 天），防止新鲜度判据静默失效。
      - name: 备份校验脚本自检（backup-verify，新鲜 + 过期）
        run: |
          set -e
          DC="docker compose -f docker-compose.staging.yml"
          # 新鲜路径：刚备份出的 dump 应通过（输出含 md5）
          $DC exec -T -e BACKUP_DIR=/tmp/dr-backups postgres sh -s < tools/backup-verify.sh
          # 过期路径：副本 mtime 拨回 2020-01-01（busybox touch 不认相对时间，用 POSIX -t），须以退出码 4 失败
          $DC exec -T postgres sh -c 'cp "$(ls -1t /tmp/dr-backups/deepresearch_*.dump | head -n 1)" /tmp/dr-backups/stale.dump && touch -t 202001010000 /tmp/dr-backups/stale.dump'
          set +e
          $DC exec -T -e BACKUP_TARGET=/tmp/dr-backups/stale.dump postgres sh -s < tools/backup-verify.sh
          rc=$?
          set -e
          test "$rc" = "4"
          echo "backup-verify drill ok"

      - name: 构建 API 镜像
        run: docker build -f Dockerfile.api -t deepresearch-api:ci .

      - name: 清理（含数据卷）
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  # W9（§7.8）：前端构建须在 CI 真实验证（npm ci + tsc 类型检查 + production build），
  # 否则「本地 build 过、CI 没管」会让前端回归静默积累。不依赖 LLM / API key。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend deps (npm ci)
        working-directory: web/frontend
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: web/frontend
        run: npx tsc --noEmit

      # 验收点② 引入：纯逻辑单测（vitest）。范围由 vite.config.ts 的 test.include 限定到
      # `src/**/*.test.ts` —— vitest 默认 include 会连 Playwright 的 e2e/*.spec.ts 一起吞进来。
      # 现有重心是质量判定模型（任务完成 vs 质量通过两个维度）；零 LLM、零网络。
      - name: Unit tests (vitest)
        working-directory: web/frontend
        run: npm run test:unit

      # 需求 11 防复发：色板 token 守卫。用字符串覆盖内置色板名（如 `cyan: '#66e3ff'`）
      # 会整体替换 {50..950} 色阶，使 text-cyan-200 / bg-cyan-300 等带档位的类静默失效；
      # tsc / vite build / Playwright E2E 均不报错，只能靠比对 dist CSS 发现。零 LLM、零网络。
      - name: "Guard: Tailwind 色板 token"
        run: python3 tools/check_tailwind_tokens.py

      # R8 新增：UI 反模式回归防线（impeccable detect，59 条确定性规则）。
      # 为什么需要它：`docs/web-frontend-audit.md` 自陈边界是「静态源码审计，未做浏览器渲染实测」，
      # 而 R7 收口唯一未做项是截图基线（跨环境中文字体渲染不稳定）⇒ 前端视觉质量**没有回归防线**。
      # 确定性规则判定代码与渲染属性、不碰像素 ⇒ 当初放弃截图基线的理由对它不成立。
      # 零 LLM、零 API key；检测器由 web/frontend 的 devDependency 提供（上方 npm ci 已装）。
      # 误报治理走 `.impeccable/config.json`（impeccable ignores ...），不在此维护第二份名单。
      - name: "Guard: UI 反模式（impeccable detect）"
        run: python3 tools/check_ui_patterns.py

      - name: Build (vite production)
        working-directory: web/frontend
        run: npm run build

  # P1 浏览器 E2E（C 后续增量 #15）：本机门禁改为 CI 门禁。
  # 成本与稳定性以实测为准（首轮记录见 docs/project-status.md）：
  # 装 Python 依赖 + npm ci + vite build + playwright install --with-deps chromium + 10 条用例。
  # 用官方 Chromium（E2E_CHANNEL=chromium），不依赖 runner 上预装的 Chrome。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev-lock.txt

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend deps (npm ci)
        working-directory: web/frontend
        run: npm ci

      - name: Build frontend (FastAPI serves dist/)
        working-directory: web/frontend
        run: npm run build

      # 截图基线固字（visual-baseline.spec.ts）：金标准在 Ubuntu + Noto CJK 下生成；
      # 缺 CJK 字体时中文回退到 DejaVu/内置位图，像素必飘 —— 这正是 R7 当初放弃截图基线的根因。
      # 视觉基线需要固定的 Noto CJK；61MB 下载在 GitHub 镜像上偶发 >3 分钟。
      # 用 actions/cache 缓存 .deb，避免每个 PR 重复下载（首次慢、之后快）。
      - name: Cache CJK font package
        uses: actions/cache@v4
        with:
          path: ~/.cache/dr-fonts
          key: fonts-noto-cjk-20230817-${{ runner.os }}

      - name: Install CJK fonts (visual baseline pinning)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          pkg_dir="$HOME/.cache/dr-fonts"
          mkdir -p "$pkg_dir"
          if ! ls "$pkg_dir"/*.deb >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if (cd "$pkg_dir" && apt-get download fonts-noto-cjk); then
                break
              fi
              echo "字体包下载第 ${attempt} 次失败，10s 后重试"
              sleep 10
            done
          fi
          sudo dpkg -i "$pkg_dir"/*.deb

      # Playwright 浏览器 ~170MB；GitHub 镜像偶发极慢（实测 e2e 18m）。按 lock 缓存浏览器，
      # 命中时跳过下载；step 超时兜底（系统依赖仍由 --with-deps 安装）。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        timeout-minutes: 20
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E (DR_DEMO=1)
        working-directory: web/frontend
        env:
          E2E_CHANNEL: chromium
          DR_PYTHON: python
          OTEL_SDK_DISABLED: "true"
        # 刻意直调 playwright 而不是 `npm run e2e`：后者现在会先 build，
        # 而本 job 上一步已经 build 过（dist 由 FastAPI 托管），再 build 一次是重复的。
        run: npx playwright test

      # 视觉回归诊断：失败时保留 test-results/（actual / diff / expected 三图 + error-context）。
      # 用途①：评审可在 PR 里直接下载查看像素差异；
      # 用途②：金标准基准环境是**本 job 的 ubuntu-latest + 官方 chromium**，若与生成金标准的
      #        本地 Linux 环境有渲染微差，从这里的 `*-actual.png` 取真实渲染重新生成金标准。
      - name: Upload Playwright results (visual diffs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-results
          path: web/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
